
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>College Football Power Rankings</title>

<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    font-family: Arial, sans-serif;
    background: radial-gradient(
        ellipse at top,
        #1b3255 0%,
        #0b1527 55%,
        #050a14 100%
    );
    background-attachment: fixed;
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    margin: 15px auto 20px;
}

h1 {
    font-family: Teko, sans-serif;
    font-size: clamp(38px, 6vw, 72px);
    line-height: 0.95;
    margin: 0;
    letter-spacing: 1px;
}

.subtitle {
    color: #aabbd3;
    font-size: 14px;
    margin-top: 8px;
}

h2 {
    font-family: Teko, sans-serif;
    font-size: 42px;
    text-align: center;
    margin: 15px 0 5px;
}

.toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px;
    max-width: 1050px;
    margin: 12px auto 18px;
    padding: 10px;
    border-radius: 12px;
    background: #17243b;
    border: 1px solid #405574;
}

button, select {
    font-family: Arial, sans-serif;
}

.toolbar button,
.toolbar select {
    background: #243955;
    color: white;
    border: 1px solid #466080;
    border-radius: 7px;
    padding: 10px 13px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.toolbar button:hover,
.toolbar select:hover {
    background: #345376;
}

.toolbar button.selected {
    background: #3767a1;
    border-color: #77aeef;
}

#weekLabel {
    font-size: 14px;
    font-weight: bold;
    white-space: nowrap;
}

#rankings {
    max-width: 900px;
    margin: 15px auto 55px;
}

.ranking-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #17263e;
    border: 1px solid #304762;
    border-left: 5px solid #506d95;
    border-radius: 9px;
    padding: 9px 12px;
    min-height: 62px;
    margin: 6px 0;
}

.ranking-card.dragging {
    opacity: 0.45;
}

.ranking-card.drag-over {
    border-top: 3px solid #72adff;
}

.rank-number {
    font-family: Teko, sans-serif;
    font-size: 32px;
    min-width: 39px;
    line-height: 1;
    text-align: center;
}

.team-logo {
    width: 39px;
    height: 39px;
    object-fit: contain;
    flex-shrink: 0;
}

.logo-placeholder {
    width: 39px;
    height: 39px;
    border: 1px dashed #587194;
    border-radius: 8px;
    flex-shrink: 0;
}

.team-picker {
    position: relative;
    flex: 1;
    min-width: 0;
}

.team-search {
    width: 100%;
    border: 1px solid #3a5376;
    background: #0c1a30;
    color: white;
    border-radius: 7px;
    padding: 10px;
    font-size: 14px;
    outline: none;
}

.team-search:focus {
    border-color: #78aeef;
}

.team-search::placeholder {
    color: #899db9;
}

.team-results {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    right: 0;
    background: #1a2d49;
    border: 1px solid #5877a0;
    border-radius: 8px;
    max-height: 240px;
    overflow-y: auto;
    z-index: 100;
    box-shadow: 0 10px 24px #0008;
}

.team-results.open {
    display: block;
}

.team-option {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px;
    font-size: 13px;
    cursor: pointer;
}

.team-option:hover {
    background: #345376;
}

.team-option img {
    width: 26px;
    height: 26px;
    object-fit: contain;
}

.no-results {
    color: #b8c6d9;
    font-size: 12px;
    padding: 12px;
}

.movement {
    font-weight: bold;
    white-space: nowrap;
    min-width: 35px;
    text-align: center;
    font-size: 13px;
}

.movement.up {
    color: #4ade80;
}

.movement.down {
    color: #fb7185;
}

.movement.same {
    color: #94a3b8;
}

.card-actions {
    display: flex;
    align-items: center;
    gap: 5px;
}

.card-actions button {
    background: #293f60;
    color: white;
    border: 1px solid #4a668e;
    border-radius: 6px;
    width: 33px;
    height: 34px;
    cursor: pointer;
    font-size: 17px;
}

.card-actions button:hover {
    background: #426b9c;
}

.card-actions button:disabled {
    opacity: 0.35;
    cursor: default;
}

.card-actions .remove {
    color: #ff96a1;
}

.drag-handle {
    cursor: grab;
    color: #a8bcd7;
    font-size: 21px;
    user-select: none;
}

.note {
    text-align: center;
    font-size: 12px;
    color: #8fa2bd;
    margin-top: 12px;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    .toolbar {
        gap: 5px;
        padding: 8px;
    }

    .toolbar button,
    .toolbar select {
        padding: 9px 8px;
        font-size: 12px;
    }

    .ranking-card {
        padding: 7px 6px;
        gap: 6px;
    }

    .rank-number {
        min-width: 27px;
        font-size: 27px;
    }

    .team-logo,
    .logo-placeholder {
        width: 29px;
        height: 29px;
    }

    .team-search {
        font-size: 12px;
        padding: 9px 5px;
    }

    .movement {
        font-size: 11px;
        min-width: 24px;
    }

    .card-actions {
        gap: 3px;
    }

    .card-actions button {
        width: 27px;
        height: 31px;
        font-size: 14px;
    }

    .drag-handle {
        display: none;
    }
}
</style>
</head>

<body>

<header>
    <h1>COLLEGE FOOTBALL POWER RANKINGS</h1>
    <div class="subtitle">Weekly College Football Power Rankings Builder</div>
</header>

<h2 id="weekTitle">Week 1 Rankings</h2>

<div class="toolbar">

    <select id="seasonSelect" onchange="changeSeason()">
        <option value="2026">2026</option>
        <option value="2027">2027</option>
        <option value="2028">2028</option>
        <option value="2029">2029</option>
        <option value="2030">2030</option>
    </select>

    <button onclick="previousWeek()" title="Previous Week">❮</button>

    <span id="weekLabel">Week 1</span>

    <button onclick="nextWeek()" title="Next Week">❯</button>

    <button id="top10Button" onclick="setRankingSize(10)">
        Top 10
    </button>

    <button id="top25Button" onclick="setRankingSize(25)">
        Top 25
    </button>

    <button onclick="window.location.href='index.html'">
        NFL Rankings
    </button>

</div>

<div id="rankings"></div>

<p class="note">
    Rankings save automatically in this browser.
    Search for any FBS team to add it to your rankings.
</p>

<script>
const today = new Date();

let currentSeason = today.getFullYear();

if (today.getMonth() <= 1) {
    currentSeason--;
}

let currentWeek = Number(
    localStorage.getItem("college_currentWeek")
) || 1;

let rankingSize = Number(
    localStorage.getItem("college_rankingSize")
) || 25;

// All weeks hold 25 positions.
// Top 10 only changes the number of visible positions.
const EMPTY_RANKINGS = Array(25).fill(null);

function storageKey() {
    return "college_rankings_" +
        currentSeason + "_week_" + currentWeek;
}

function loadRankings() {
    try {
        const saved = JSON.parse(
            localStorage.getItem(storageKey())
        );

        if (Array.isArray(saved)) {
            return [
                ...saved.slice(0, 25),
                ...Array(25).fill(null)
            ].slice(0, 25);
        }
    } catch (error) {
        console.error("Could not read saved rankings", error);
    }

    return [...EMPTY_RANKINGS];
}

let rankings = loadRankings();

// College team data is loaded from ESPN.
let collegeTeams = [];
let teamsLoaded = false;

async function loadCollegeTeams() {
    try {
        const response = await fetch(           
            "https://site.web.api.espn.com/apis/site/v2/sports/football/college-football/teams?groups=80&groupType=conference&enable=groups"
    );
        if (!response.ok) {
            throw new Error("Team directory unavailable");
        }

        const data = await response.json();

        const entries =
            data.sports?.[0]?.leagues?.[0]?.teams || [];

        collegeTeams = entries.map(entry => {
            const team = entry.team;

            return {
                id: String(team.id),
                name: team.displayName,
                shortName: team.name,
                location: team.location,
                logo: team.logos?.[0]?.href ||
                    "https://a.espncdn.com/i/teamlogos/ncaa/500/" +
                    team.id + ".png",
                color: team.color
                    ? "#" + team.color.replace("#", "")
                    : "#506d95"
            };
        });

        collegeTeams.sort((a, b) =>
            a.name.localeCompare(b.name)
        );

        teamsLoaded = collegeTeams.length > 0;

        if (!teamsLoaded) {
            throw new Error("No college teams returned");
        }

        displayRankings();

    } catch (error) {
        console.error("College team loading error:", error);
        teamsLoaded = false;

        // Cards remain editable when the directory
        // becomes available after a reload.
        displayRankings();
    }
}

function saveRankings() {
    localStorage.setItem(
        storageKey(),
        JSON.stringify(rankings)
    );
}

function getTeam(id) {
    return collegeTeams.find(team =>
        team.id === String(id)
    );
}

function getMovement(teamId, currentRank) {
    if (!teamId || currentWeek === 1) return "";

    const oldKey = "college_rankings_" +
        currentSeason + "_week_" + (currentWeek - 1);

    let previous;

    try {
        previous = JSON.parse(
            localStorage.getItem(oldKey)
        );
    } catch (error) {
        return "";
    }

    if (!Array.isArray(previous)) return "";

    const oldIndex = previous.indexOf(teamId);

    if (oldIndex < 0) return "";

    const difference = oldIndex + 1 - currentRank;

    if (difference > 0) {
        return '<span class="movement up">▲ ' +
            difference + '</span>';
    }

    if (difference < 0) {
        return '<span class="movement down">▼ ' +
            Math.abs(difference) + '</span>';
    }

    return '<span class="movement same">—</span>';
}

function displayRankings() {
    document.getElementById("seasonSelect").value =
        String(currentSeason);

    document.getElementById("weekTitle").textContent =
        "Week " + currentWeek + " Rankings";

    document.getElementById("weekLabel").textContent =
        "Week " + currentWeek;

    document.getElementById("top10Button")
        .classList.toggle(
            "selected", rankingSize === 10
        );

    document.getElementById("top25Button")
        .classList.toggle(
            "selected", rankingSize === 25
        );

    const container = document.getElementById("rankings");
    container.innerHTML = "";

    for (let i = 0; i < rankingSize; i++) {
        const teamId = rankings[i];
        const team = teamId ? getTeam(teamId) : null;

        const card = document.createElement("div");
        card.className = "ranking-card";
        card.dataset.index = i;
        card.draggable = true;

        if (team?.color) {
            card.style.borderLeftColor = team.color;
        }

        const rank = document.createElement("strong");
        rank.className = "rank-number";
        rank.textContent = (i + 1) + ".";
        card.appendChild(rank);

        if (team?.logo) {
            const logo = document.createElement("img");
            logo.className = "team-logo";
            logo.src = team.logo;
            logo.alt = "";
            card.appendChild(logo);
        } else {
            const placeholder = document.createElement("div");
            placeholder.className = "logo-placeholder";
            card.appendChild(placeholder);
        }

        const picker = document.createElement("div");
        picker.className = "team-picker";

        const search = document.createElement("input");
        search.className = "team-search";
        search.type = "search";
        search.autocomplete = "off";
        search.placeholder = teamsLoaded
            ? "Search for a team..."
            : "Loading teams...";

        search.value = team?.name ||
            (teamId ? "Saved team (" + teamId + ")" : "");

        const results = document.createElement("div");
        results.className = "team-results";

        search.addEventListener("focus", () => {
            search.select();

            showTeamResults(i, search, results);
        });

        search.addEventListener("input", () => {
            showTeamResults(i, search, results);
        });

        search.addEventListener("keydown", event => {
            if (event.key === "Escape") {
                results.classList.remove("open");
                search.blur();
            }
        });

        picker.appendChild(search);
        picker.appendChild(results);
        card.appendChild(picker);

        const movement = document.createElement("div");
        movement.innerHTML = getMovement(teamId, i + 1);
        card.appendChild(movement);

        const actions = document.createElement("div");
        actions.className = "card-actions";

        const up = document.createElement("button");
        up.textContent = "↑";
        up.title = "Move up";
        up.disabled = i === 0;
        up.onclick = () => moveTeam(i, i - 1);

        const down = document.createElement("button");
        down.textContent = "↓";
        down.title = "Move down";
        down.disabled = i === rankingSize - 1;
        down.onclick = () => moveTeam(i, i + 1);

        const remove = document.createElement("button");
        remove.textContent = "×";
        remove.title = "Remove team";
        remove.className = "remove";
        remove.disabled = !teamId;
        remove.onclick = () => removeTeam(i);

        actions.appendChild(up);
        actions.appendChild(down);
        actions.appendChild(remove);
        card.appendChild(actions);

        const handle = document.createElement("span");
        handle.className = "drag-handle";
        handle.textContent = "⠿";
        handle.title = "Drag to reorder";
        card.appendChild(handle);

        setupCardDragging(card);
        container.appendChild(card);
    }
}

function showTeamResults(index, input, menu) {
    menu.innerHTML = "";

    if (!teamsLoaded) {
        const message = document.createElement("div");
        message.className = "no-results";
        message.textContent =
            "College teams could not be loaded. Refresh to retry.";
        menu.appendChild(message);
        menu.classList.add("open");
        return;
    }

    const query = input.value.trim().toLowerCase();

    const matches = collegeTeams.filter(team => {
        const alreadyUsed = rankings.some(
            (id, position) =>
                position !== index && id === team.id
        );

        if (alreadyUsed) return false;

        return team.name.toLowerCase().includes(query) ||
            team.shortName.toLowerCase().includes(query) ||
            team.location.toLowerCase().includes(query);
    }).slice(0, 12);

    if (matches.length === 0) {
        const message = document.createElement("div");
        message.className = "no-results";
        message.textContent = "No matching teams found";
        menu.appendChild(message);
    }

    matches.forEach(team => {
        const option = document.createElement("div");
        option.className = "team-option";

        const logo = document.createElement("img");
        logo.src = team.logo;
        logo.alt = "";

        const name = document.createElement("span");
        name.textContent = team.name;

        option.appendChild(logo);
        option.appendChild(name);

        // pointerdown works for mouse and touch.
        option.addEventListener("pointerdown", event => {
            event.preventDefault();
            selectTeam(index, team.id);
        });

        menu.appendChild(option);
    });

    menu.classList.add("open");
}

function selectTeam(index, id) {
    if (rankings.some(
        (existing, position) =>
            position !== index && existing === id
    )) {
        return;
    }

    rankings[index] = id;
    saveRankings();
    displayRankings();
}

function removeTeam(index) {
    rankings[index] = null;
    saveRankings();
    displayRankings();
}

function moveTeam(from, to) {
    if (to < 0 || to >= rankingSize) return;

    [rankings[from], rankings[to]] =
        [rankings[to], rankings[from]];

    saveRankings();
    displayRankings();
}

// Desktop HTML drag-and-drop.
let draggingIndex = null;

function setupCardDragging(card) {
    card.addEventListener("dragstart", event => {
        // Don't drag when interacting with search fields.
        if (event.target.closest(".team-picker")) {
            event.preventDefault();
            return;
        }

        draggingIndex = Number(card.dataset.index);
        card.classList.add("dragging");

        event.dataTransfer.effectAllowed = "move";
        event.dataTransfer.setData(
            "text/plain", String(draggingIndex)
        );
    });

    card.addEventListener("dragover", event => {
        if (draggingIndex === null) return;

        event.preventDefault();
        card.classList.add("drag-over");
    });

    card.addEventListener("dragleave", () => {
        card.classList.remove("drag-over");
    });

    card.addEventListener("drop", event => {
        event.preventDefault();

        if (draggingIndex === null) return;

        const target = Number(card.dataset.index);

        // Move the source position into the target position.
        const [moved] = rankings.splice(draggingIndex, 1);
        rankings.splice(target, 0, moved);

        draggingIndex = null;
        saveRankings();
        displayRankings();
    });

    card.addEventListener("dragend", () => {
        draggingIndex = null;

        document.querySelectorAll(".ranking-card")
            .forEach(element => {
                element.classList.remove(
                    "dragging", "drag-over"
                );
            });
    });
}

function setRankingSize(size) {
    if (size !== 10 && size !== 25) return;

    rankingSize = size;

    localStorage.setItem(
        "college_rankingSize",
        String(size)
    );

    displayRankings();
}

function nextWeek() {
    if (currentWeek >= 18) return;

    saveRankings();

    const oldRankings = [...rankings];

    currentWeek++;
    localStorage.setItem(
        "college_currentWeek", String(currentWeek)
    );

    const existing = localStorage.getItem(storageKey());

    if (existing) {
        rankings = loadRankings();
    } else {
        // Carry the previous week's order forward.
        rankings = oldRankings;
        saveRankings();
    }

    displayRankings();
}

function previousWeek() {
    if (currentWeek <= 1) return;

    saveRankings();

    currentWeek--;

    localStorage.setItem(
        "college_currentWeek", String(currentWeek)
    );

    rankings = loadRankings();
    displayRankings();
}

function changeSeason() {
    saveRankings();

    currentSeason = Number(
        document.getElementById("seasonSelect").value
    );

    currentWeek = 1;

    localStorage.setItem("college_currentWeek", "1");

    rankings = loadRankings();
    displayRankings();
}

// Close search results when clicking elsewhere.
document.addEventListener("pointerdown", event => {
    if (!event.target.closest(".team-picker")) {
        document.querySelectorAll(".team-results")
            .forEach(menu => {
                menu.classList.remove("open");
            });
    }
});

displayRankings();
loadCollegeTeams();
</script>

</body>
</html>
